name: Unified Header and Back Navigation CI
on:
  push:
    branches:
      - feature/alternate-brick-logo-preview-20261031
      - feature/catalog-filter-sort-20261031
      - feature/lego-camera-set-scan-20261031
      - feature/owned-set-photo-review-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - name: Check homepage-identical headers and return links
        run: |
          ! grep -q 'header.classList.add("lego-theme-header")' src/lego-entry.ts
          ! grep -q 'header.classList.add("lego-detail-header")' src/lego-entry.ts
          grep -q 'const header=e("header","lego-header")' src/lego-entry.ts
          grep -q 'const navigation=e("nav","archiv-set-back-navigation")' src/lego-entry.ts
          grep -q 'main.append(button("← Back to Catalog"' src/lego-entry.ts
          grep -q 'personalArchiveTitle(currentUser.displayName||ownProfile?.name)' src/lego-entry.ts
          grep -q 'const collectorRoute=collectorViewFromHash()' src/lego-entry.ts
          test -s public/archiv-toy-brick-logo.webp
          if [ -f src/lego-filters.ts ]; then
            grep -q 'filterSets(' src/lego-entry.ts
            grep -q 'Catalog: Most Popular' src/lego-entry.ts
          fi
          test -s dist-web/index.html
          if [ -f src/lego-camera-scanner.ts ]; then
            grep -q 'launchSetScanner' src/lego-entry.ts
            grep -q 'capture","environment' src/lego-camera-scanner.ts
            grep -q 'findSetNumberMatches' src/lego-camera-scanner.ts
          fi
