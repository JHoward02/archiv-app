name: Build Archív Android test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-test.yml'
      - 'android-test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Archív staging source
        uses: actions/checkout@v4
        with:
          ref: archiv-2-lego-staging
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate icon from existing Archív logo
        run: |
          python3 -m pip install --user pillow
          cd android-test
          python3 generate_icons.py ../public/archiv-lego-logo.png
      # AndroidX is enabled in android-test/gradle.properties on the staging branch.
      - name: Build Android debug APK
        working-directory: android-test
        run: gradle --no-daemon assembleDebug
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: archiv-android-test-apk
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
