name: Deploy Collector Scan to GitHub Pages

on:
  push:
    branches: [main, archiv-2-lego-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - name: Build isolated profiles preview
        run: |
          git fetch origin feature/restore-profile
          git worktree add "$RUNNER_TEMP/archiv-profile-preview" 08a8a2d74e7237f55d954b9fd79c0dca6e9cdea3
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" ci
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" run build:web
          mkdir -p dist-web/profile-preview
          cp -R "$RUNNER_TEMP/archiv-profile-preview/dist-web/." dist-web/profile-preview/
      # Collector profile remains pinned; preview now exercises separate Google Sign in and Sign up.
      # Staging retains its independent preview and unrelated native features remain excluded.
      # Approved staging-only refresh: optional signup email preference and reordered registration notice.
      # Production application remains pinned to the existing approved collector-profile release.
      # Authorized staging-only refresh: signup disclosure Privacy Policy and Terms links.
      # Production application and approved legal pages stay pinned to their immutable release.
      # Isolated preview refresh after CI-tested Pokémon alias for collecting-theme cards.
      - name: Build isolated LEGO preview
        run: |
          git fetch origin feature/catalog-filter-sort-20261031
          git worktree add "$RUNNER_TEMP/archiv-lego-preview" origin/feature/catalog-filter-sort-20261031
          PREVIEW_SHA=$(git -C "$RUNNER_TEMP/archiv-lego-preview" rev-parse HEAD)
          echo "Preview source: $PREVIEW_SHA"
          grep -q '/src/lego-entry.ts' "$RUNNER_TEMP/archiv-lego-preview/index.html"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/auth-signup-decision.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/collector-home-summary.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-filters.ts"
          grep -Fq 'filterSets(' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'archiv-filter-bar' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Reject any preview that would silently revert the shared logo or back navigation.
          grep -q 'const navigation=e("nav","archiv-set-back-navigation")' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          ! grep -q 'header.classList.add("lego-detail-header")' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          ! grep -q 'header.classList.add("lego-theme-header")' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -q 'const collectorRoute=collectorViewFromHash()' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Stop preview publication if the LEGO-specific logo asset is missing again.
          test -s "$RUNNER_TEMP/archiv-lego-preview/public/archiv-lego-logo.png"
          test -s "$RUNNER_TEMP/archiv-lego-preview/public/archiv-toy-brick-logo.webp"
          grep -q 'archiv-toy-brick-logo.webp' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Staging-only: let the alternate logo blend into the cream page and inset the account control.
          grep -q 'mix-blend-mode:multiply' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -q 'lego-header::before{content:none}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -q 'lego-header>.lego-account-controls{margin-right:18px}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -q 'right:16px;' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          # This homepage release combines the former stacked catalog titles into one heading.
          grep -Fq 'shell.append(e("h2","archiv-catalog-heading","Catalog: Most Popular"))' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          npm --prefix "$RUNNER_TEMP/archiv-lego-preview" ci
          # The web-only auth candidate deliberately excludes unrelated native/import tooling.
          # Import catalog data using the separately vetted staging importer, not staged UI.
          git fetch origin archiv-2-lego-staging
          git worktree add "$RUNNER_TEMP/archiv-data-source" origin/archiv-2-lego-staging
          mkdir -p "$RUNNER_TEMP/archiv-data-source/data"
          curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/sets.csv.gz" -o "$RUNNER_TEMP/archiv-data-source/data/sets.csv.gz"
          curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/themes.csv.gz" -o "$RUNNER_TEMP/archiv-data-source/data/themes.csv.gz"
          for name in colors parts minifigs inventories inventory_parts inventory_minifigs; do
            curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/${name}.csv.gz" -o "$RUNNER_TEMP/archiv-data-source/data/${name}.csv.gz"
          done
          node "$RUNNER_TEMP/archiv-data-source/scripts/import-rebrickable.mjs"
          node --max-old-space-size=6144 "$RUNNER_TEMP/archiv-data-source/scripts/import-lego-parts.mjs"
          cp "$RUNNER_TEMP/archiv-data-source/src/lego-catalog.json" "$RUNNER_TEMP/archiv-lego-preview/src/lego-catalog.json"
          cp "$RUNNER_TEMP/archiv-data-source/src/lego-themes.json" "$RUNNER_TEMP/archiv-lego-preview/src/lego-themes.json"
          mkdir -p "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts"
          cp -R "$RUNNER_TEMP/archiv-data-source/public/lego-parts/." "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts/"
          # Enable profile preferences and self-service deletion for the staging preview.
          # Production is compiled separately using the approved immutable release.
          VITE_PROFILE_BACKEND_READY=true npm --prefix "$RUNNER_TEMP/archiv-lego-preview" run build:web
          mkdir -p dist-web/lego-preview
          cp -R "$RUNNER_TEMP/archiv-lego-preview/dist-web/." dist-web/lego-preview/
          printf '{"source_commit":"%s","branch":"feature/catalog-filter-sort-20261031"}\n' "$PREVIEW_SHA" > dist-web/lego-preview/build-info.json
          # Promote the verified LEGO build to the production root, without
          # removing independent preview directories or the rollback branch.
          # Keep the production release pinned while new shopping features are tested.
          # The preview above always builds from the latest LEGO staging branch.
          # Rebuild preview with optional Firebase Google sign-in and cloud LEGO records.
          # Retry staging preview via newest push; Pages concurrency cancels superseded runs.
          # Refresh staging preview for Google sign-in and sign-up button presentation.
          # Refresh LEGO staging preview with expandable account menu.
          # Refresh staging with Google profile image account toggle.
          # Stage private collector analytics dashboard and reporting UI.
          # Stage per-user activity and daily reporting; production pin unchanged.
          # Preview readable activity and registration totals.
          # Preview Firebase free-plan account reporting without callable functions.
          # Refresh theme header account and back-button alignment in staging.
          # Refresh product detail header controls alignment in staging.
          # Reserve a dedicated navigation lane above the theme tile.
          # Preview mobile homepage avatar anchored to upper-right of logo.
          # Preview theme set-list page without redundant featured theme brick.
          # Production stays on its pre-policy-change source snapshot until approved.
          # Do not copy unapproved staging files into the production root.
          git worktree add "$RUNNER_TEMP/archiv-lego-production" 7ad5c81340e72b69821b14a9f616ed65ea48cb3e^
          npm --prefix "$RUNNER_TEMP/archiv-lego-production" ci
          # Restore the full generated catalog used by successful production builds.
          # The staging importer writes src/*.json and public/lego-parts, NOT public/data.
          # Copy only generated catalog/inventory data, never staged application code or styles.
          cp "$RUNNER_TEMP/archiv-lego-preview/src/lego-catalog.json" "$RUNNER_TEMP/archiv-lego-production/src/lego-catalog.json"
          cp "$RUNNER_TEMP/archiv-lego-preview/src/lego-themes.json" "$RUNNER_TEMP/archiv-lego-production/src/lego-themes.json"
          mkdir -p "$RUNNER_TEMP/archiv-lego-production/public/lego-parts"
          cp -R "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts/." "$RUNNER_TEMP/archiv-lego-production/public/lego-parts/"
          # Fail the deployment rather than silently publishing the tiny seed catalog again.
          node -e 'const fs=require("fs");const root=process.argv[1];const sets=JSON.parse(fs.readFileSync(root+"/src/lego-catalog.json"));const themes=JSON.parse(fs.readFileSync(root+"/src/lego-themes.json"));const shards=fs.readdirSync(root+"/public/lego-parts").filter(x=>/^[0-9]+[.]json$/.test(x));if(sets.length<25000||themes.length<15||shards.length!==128)throw Error("Incomplete production catalog: "+sets.length+" sets, "+themes.length+" themes, "+shards.length+" inventory shards");console.log("Production catalog validated:",sets.length,"sets,",themes.length,"themes,",shards.length,"inventory shards")' "$RUNNER_TEMP/archiv-lego-production"
          # Promote the specifically approved logo, account inset, warm header, and single catalog heading.
          # Preserve existing collector dashboard, legal policies, native workflows and rollback refs.
          git fetch origin feature/alternate-brick-logo-preview-20261031
          RELEASE_SHA="a3456e658c2a50d50353e9b9929c2d616135c522"
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          # The production base worktree already has the correct LEGO entrypoint.
          # Restore all new auth source AND its LEGO branding asset together.
          git -C "$RUNNER_TEMP/archiv-lego-production" restore --source="$RELEASE_SHA" -- src/lego-entry.ts src/lego-styles.css src/auth-signup-decision.ts src/collector-home-summary.ts public/archiv-lego-logo.png public/archiv-toy-brick-logo.webp
          test -s "$RUNNER_TEMP/archiv-lego-production/public/archiv-lego-logo.png"
          test -s "$RUNNER_TEMP/archiv-lego-production/public/archiv-toy-brick-logo.webp"
          grep -Fq 'art.src=import.meta.env.BASE_URL+"archiv-toy-brick-logo.webp"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'shell.append(e("h2","archiv-catalog-heading","Catalog: Most Popular"))' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq '.lego-logo img{mix-blend-mode:multiply}' "$RUNNER_TEMP/archiv-lego-production/src/lego-styles.css"
          grep -Fq '.lego-header>.lego-account-controls{margin-right:18px}' "$RUNNER_TEMP/archiv-lego-production/src/lego-styles.css"
          grep -Fq 'right:16px;' "$RUNNER_TEMP/archiv-lego-production/src/lego-styles.css"
          # Require the reviewed homepage-identical header and both set-navigation controls.
          grep -q 'const navigation=e("nav","archiv-set-back-navigation")' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'main.append(button("← Back to Catalog"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          ! grep -q 'header.classList.add("lego-detail-header")' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          ! grep -q 'header.classList.add("lego-theme-header")' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'privacy.href=import.meta.env.BASE_URL+"privacy.html"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'terms.href=import.meta.env.BASE_URL+"terms.html"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          # Preserve full Google display name on private Profile, but use first names elsewhere.
          grep -q 'firstNameFromDisplayName(currentUser.displayName||ownProfile?.name)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'user.displayName?.trim()||ownProfile?.name||"Collector"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'personalArchiveTitle(currentUser.displayName||ownProfile?.name)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          # The signed-in dashboard must not publish without all three private pages and affiliate disclosures.
          test -s "$RUNNER_TEMP/archiv-lego-production/src/collector-home-summary.ts"
          grep -q 'collectorOverview(data,saved)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'setsWithStatus(data,saved,desired)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'collectingThemeTiles(themes,totals.collectingThemes)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'catalogLink.href="#/complete-catalog"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'bottom.href="#/complete-catalog"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'buy.href=ebaySetSearch(row)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -q 'Archív may earn a commission if you buy through this eBay link.' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          VITE_PROFILE_BACKEND_READY=true npm --prefix "$RUNNER_TEMP/archiv-lego-production" run build:web
          cp -R "$RUNNER_TEMP/archiv-lego-production/dist-web/." dist-web/
          # Keep the independently built staging preview after production copy.
          cp -R "$RUNNER_TEMP/archiv-lego-preview/dist-web/." dist-web/lego-preview/
          printf '{"source_commit":"%s","branch":"feature/catalog-filter-sort-20261031"}\n' "$PREVIEW_SHA" > dist-web/lego-preview/build-info.json
          # Legal policies were previously approved and must remain unchanged.
          git fetch origin release/collector-profile-web-20261031
          POLICY_SHA="997b04bbbba91821f375156519b36038321eed23"
          test "$(git rev-parse FETCH_HEAD)" = "$POLICY_SHA"
          git show "$POLICY_SHA:public/privacy.html" > dist-web/privacy.html
          git show "$POLICY_SHA:public/terms.html" > dist-web/terms.html
          test -s dist-web/privacy.html
          test -s dist-web/terms.html
          grep -q 'Delete your Archív account yourself' dist-web/privacy.html
          grep -q 'Delete profile' dist-web/terms.html
          grep -q 'not currently an approved LEGO.com affiliate' dist-web/terms.html
          # Record immutable release provenance for post-deploy verification.
          printf '{"source_commit":"%s","branch":"feature/alternate-brick-logo-preview-20261031","profile_backend_ready":true,"legal_source_commit":"%s"}\n' "$RELEASE_SHA" "$POLICY_SHA" > dist-web/build-info.json
          # Retire the unused Impact impression/conversion script on the pinned
          # root site. It loads before user interaction and the new policy must
          # describe actual tracking practices accurately.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist-web/index.html')
          html=root.read_text()
          scripts=re.findall(r'<script\b[^>]*>[\s\S]*?</script>',html,flags=re.I)
          impact=[x for x in scripts if 'utt.impactcdn.com' in x or 'impactStat' in x]
          assert len(impact)==1, f'Expected one legacy Impact script; found {len(impact)}'
          html=html.replace(impact[0],'')
          assert 'utt.impactcdn.com' not in html
          root.write_text(html)
          print('Production root: approved collector profile and policies; legacy Impact tracking script removed')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
