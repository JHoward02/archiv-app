name: Deploy Collector Scan to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - name: Build isolated profiles preview
        run: |
          git fetch origin feature/export-profile
          git worktree add "$RUNNER_TEMP/archiv-profile-preview" d76a3a20c04e89ca104724d56dc821c929a3e329
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" ci
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" run build:web
          mkdir -p dist-web/profile-preview
          cp -R "$RUNNER_TEMP/archiv-profile-preview/dist-web/." dist-web/profile-preview/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
