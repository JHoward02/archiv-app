name: Deploy Collector Scan to GitHub Pages

on:
  push:
    branches: [main, archiv-2-lego-staging]
  workflow_dispatch:
  # Rebrickable CSV refresh on Monday and Friday mornings, Pacific time.
  # GitHub schedules may run slightly later during periods of high load.
  schedule:
    - cron: '17 9 * * 1,5'
      timezone: 'America/Los_Angeles'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - name: Build isolated profiles preview
        run: |
          git fetch origin feature/restore-profile
          git worktree add "$RUNNER_TEMP/archiv-profile-preview" 08a8a2d74e7237f55d954b9fd79c0dca6e9cdea3
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" ci
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" run build:web
          mkdir -p dist-web/profile-preview
          cp -R "$RUNNER_TEMP/archiv-profile-preview/dist-web/." dist-web/profile-preview/
      # Collector profile remains pinned; preview now exercises separate Google Sign in and Sign up.
      # Staging retains its independent preview and unrelated native features remain excluded.
      # Approved staging-only refresh: optional signup email preference and reordered registration notice.
      # Production application remains pinned to the existing approved collector-profile release.
      # Authorized staging-only refresh: signup disclosure Privacy Policy and Terms links.
      # Production application and approved legal pages stay pinned to their immutable release.
      # Refresh concise photo-sharing consent in isolated LEGO preview; production remains pinned.
      - name: Build isolated LEGO preview
        run: |
          git fetch origin feature/owned-set-photo-review-20261031
          git worktree add "$RUNNER_TEMP/archiv-lego-preview" origin/feature/owned-set-photo-review-20261031
          PREVIEW_SHA=$(git -C "$RUNNER_TEMP/archiv-lego-preview" rev-parse HEAD)
          echo "Preview source: $PREVIEW_SHA"
          grep -q '/src/lego-entry.ts' "$RUNNER_TEMP/archiv-lego-preview/index.html"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/auth-signup-decision.ts"
          # Staging: two dedicated auth routes and both Firebase sign-in methods.
          test -s "$RUNNER_TEMP/archiv-lego-preview/tests/email-password-auth.test.ts"
          grep -Fq 'menu.append(button("Sign in",()=>{account.open=false;goAuthPage("sign-in")}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'menu.append(button("Sign up",()=>{account.open=false;goAuthPage("sign-up")}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'signInWithEmailAndPassword(legoAuth,address,password)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'if(!currentUser){goAuthPage("sign-in");return}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'createUserWithEmailAndPassword(legoAuth,address,password)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'sendPasswordResetEmail(legoAuth,address)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,deletionPassword))' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/collector-home-summary.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-filters.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-camera-scanner.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-set-number-scan.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-contributions.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-ui.ts"
          grep -Fq 'PHOTO_BACKEND_READY=import.meta.env.VITE_PHOTO_BACKEND_READY==="true"' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'renderPhotoModeration' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'match /communitySetPhotos/{photoId}' "$RUNNER_TEMP/archiv-lego-preview/firestore.rules"
          grep -Fq 'match /communityPhotoPermissions/{photoId}' "$RUNNER_TEMP/archiv-lego-preview/firestore.rules"
          test -s "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-contributions.ts"
          grep -Fq 'PHOTO_LICENSE_VERSION="archiv-community-photo-license-v1-2026-11-01"' "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-contributions.ts"
          grep -Fq 'Submit for community review (optional).' "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-ui.ts"
          grep -Fq 'id="community-photos"' "$RUNNER_TEMP/archiv-lego-preview/public/terms.html"
          grep -Fq 'id="uploaded-photos"' "$RUNNER_TEMP/archiv-lego-preview/public/privacy.html"
          grep -Fq 'new URL("terms.html#community-photos",window.location.href)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-ui.ts"
          grep -Fq 'new URL("privacy.html#uploaded-photos",window.location.href)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-ui.ts"
          grep -Fq 'removeOwnSetPhoto(legoDb,user.uid,photo.id)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'VITE_PHOTO_BACKEND_READY' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          ! grep -Fq 'approvedSetPhotos' "$RUNNER_TEMP/archiv-lego-preview/src/lego-photo-contributions.ts"
          test -s "$RUNNER_TEMP/archiv-lego-preview/docs/COMMUNITY_SET_PHOTOS_ROLLOUT.md"
          grep -Fq 'launchSetScanner' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Staging-only: search OR camera scan must appear directly above the catalog heading.
          python3 - "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text()
          search='const searchForm=e("form","archiv-home-search")'
          combined='discover.append(searchForm,e("span","archiv-home-search-or","OR"),scanSetNumberButton(true))'
          heading='shell.append(e("h2","archiv-catalog-heading","Catalog: Most Popular"))'
          assert search in source and combined in source and heading in source
          assert source.index(search)<source.index(combined)<source.index(heading)
          assert 'b.replaceChildren(cameraGlyph(),e("span","","Scan Set Number"))' in source
          assert 'searchFullCatalogFromHome(homeQuery.value)' in source
          PY
          grep -Fq 'capture","environment' "$RUNNER_TEMP/archiv-lego-preview/src/lego-camera-scanner.ts"
          grep -Fq 'filterSets(' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -Fq 'archiv-filter-bar' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Reject any preview that would silently revert the shared logo or back navigation.
          grep -q 'const navigation=e("nav","archiv-set-back-navigation")' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          ! grep -q 'header.classList.add("lego-detail-header")' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          ! grep -q 'header.classList.add("lego-theme-header")' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          grep -q 'const collectorRoute=collectorViewFromHash()' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Stop preview publication if the LEGO-specific logo asset is missing again.
          test -s "$RUNNER_TEMP/archiv-lego-preview/public/archiv-lego-logo.png"
          test -s "$RUNNER_TEMP/archiv-lego-preview/public/archiv-orange-sketch-20261106.webp"
          # Cache-busting unique filename is essential. Reusing the production logo URL
          # allowed a user's browser to show a cached previous image in staging.
          test "$(git -C "$RUNNER_TEMP/archiv-lego-preview" hash-object public/archiv-orange-sketch-20261106.webp)" = "bb2cb8b4e56ddf010028da16609f36a2aab5bb4f"
          grep -Fq 'archiv-orange-sketch-20261106.webp' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          ! grep -Fq 'art.src=import.meta.env.BASE_URL+"archiv-red-brick-accent-logo.webp"' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # Staging-only: let the alternate logo blend into the cream page and inset the account control.
          grep -q 'mix-blend-mode:multiply' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -q 'lego-header::before{content:none}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -q 'lego-header>.lego-account-controls{margin-right:18px}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -q 'right:16px;' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          # This homepage release combines the former stacked catalog titles into one heading.
          grep -Fq 'shell.append(e("h2","archiv-catalog-heading","Catalog: Most Popular"))' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          npm --prefix "$RUNNER_TEMP/archiv-lego-preview" ci
          # The web-only auth candidate deliberately excludes unrelated native/import tooling.
          # Import catalog data using the separately vetted staging importer, not staged UI.
          git fetch origin archiv-2-lego-staging
          git worktree add "$RUNNER_TEMP/archiv-data-source" origin/archiv-2-lego-staging
          mkdir -p "$RUNNER_TEMP/archiv-data-source/data"
          curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/sets.csv.gz" -o "$RUNNER_TEMP/archiv-data-source/data/sets.csv.gz"
          curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/themes.csv.gz" -o "$RUNNER_TEMP/archiv-data-source/data/themes.csv.gz"
          for name in colors parts minifigs inventories inventory_parts inventory_minifigs; do
            curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/${name}.csv.gz" -o "$RUNNER_TEMP/archiv-data-source/data/${name}.csv.gz"
          done
          node "$RUNNER_TEMP/archiv-data-source/scripts/import-rebrickable.mjs"
          node --max-old-space-size=6144 "$RUNNER_TEMP/archiv-data-source/scripts/import-lego-parts.mjs"
          # Keep production data safe if the download is truncated, malformed or unexpectedly small.
          # Rebuild from the complete CSV snapshot so corrections as well as new sets are reflected.
          python3 - "$RUNNER_TEMP/archiv-data-source/src/lego-catalog.json" "$RUNNER_TEMP/archiv-data-source/src/lego-themes.json" <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          import sys
          sets=json.loads(Path(sys.argv[1]).read_text())
          themes=json.loads(Path(sys.argv[2]).read_text())
          numbers=[row.get("number") for row in sets]
          if len(sets)<28000 or len(themes)<15 or len(numbers)!=len(set(numbers)) or any(not number for number in numbers):
              raise SystemExit("Refusing incomplete or duplicate Rebrickable catalog")
          snapshot={
              "source":"Rebrickable CSV downloads",
              "refreshed_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "set_count":len(sets),
              "theme_count":len(themes),
              "inventory_shard_count":128
          }
          Path("dist-web/catalog-refresh.json").write_text(json.dumps(snapshot,sort_keys=True)+"\n")
          print("Validated Rebrickable refresh:",snapshot)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("## Rebrickable catalog refresh\n\n")
              summary.write(f"- Sets: {len(sets):,}\n- Navigation themes: {len(themes):,}\n")
              summary.write(f"- Imported at (UTC): {snapshot['refreshed_at_utc']}\n")
              summary.write("- Source: complete official CSV downloads (no API key or per-visitor API calls)\n")
          PY
          cp "$RUNNER_TEMP/archiv-data-source/src/lego-catalog.json" "$RUNNER_TEMP/archiv-lego-preview/src/lego-catalog.json"
          cp "$RUNNER_TEMP/archiv-data-source/src/lego-themes.json" "$RUNNER_TEMP/archiv-lego-preview/src/lego-themes.json"
          mkdir -p "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts"
          cp -R "$RUNNER_TEMP/archiv-data-source/public/lego-parts/." "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts/"
          # Enable profile preferences and self-service deletion for the staging preview.
          # Production is compiled separately using the approved immutable release.
          # Original user-illustrated theme bricks, with set photographs unchanged.
          # Six user-provided illustrated bricks replace the faux CSS studs and labels.
          # Keep their Rebrickable set photographs unchanged.
          grep -Fq 'Six featured LEGO theme cards use the user' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -Fq 'b.append(brick,photo)' "$RUNNER_TEMP/archiv-lego-preview/src/lego-entry.ts"
          # The user-supplied bricks contain white pixels outside the drawing.
          # Keep the multiply-blended images non-isolated so the white matches the page.
          grep -Fq 'isolation:auto;' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          # Retain the sketched bricks, narrow row spacing and resize only three set photos.
          grep -Fq 'Staging: closer hand-drawn brick rows' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -Fq 'nth-child(n+4){margin-top:-24px}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          grep -Fq 'nth-child(n+3){margin-top:-9px}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          for theme in technic botanicals icons; do
            grep -Fq "[data-theme=\"$theme\"] .archiv-theme-set-photo" "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          done
          grep -Fq '.lego-theme.archiv-theme-illustrated:hover{transform:none;filter:none;box-shadow:none}' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          ! grep -Fq 'Staging sketch v2: individually drawn pencil strokes' "$RUNNER_TEMP/archiv-lego-preview/src/lego-styles.css"
          for name in city pokemon star-wars technic botanicals icons; do
            test -s "$RUNNER_TEMP/archiv-lego-preview/public/theme-bricks/theme-$name.webp"
            echo "Staged user's illustrated brick: $name"
          done
          VITE_PROFILE_BACKEND_READY=true VITE_PHOTO_BACKEND_READY=true npm --prefix "$RUNNER_TEMP/archiv-lego-preview" run build:web
          grep -Rql 'archiv-theme-illustrated' "$RUNNER_TEMP/archiv-lego-preview/dist-web/assets" || { echo "::error::User supplied themed brick components missing from preview"; exit 1; }
          for name in city pokemon star-wars technic botanicals icons; do
            cmp "$RUNNER_TEMP/archiv-lego-preview/public/theme-bricks/theme-$name.webp" "$RUNNER_TEMP/archiv-lego-preview/dist-web/theme-bricks/theme-$name.webp"
          done
          mkdir -p dist-web/lego-preview
          cp -R "$RUNNER_TEMP/archiv-lego-preview/dist-web/." dist-web/lego-preview/
          printf '{"source_commit":"%s","branch":"feature/owned-set-photo-review-20261031","photo_backend_ready":true}\n' "$PREVIEW_SHA" > dist-web/lego-preview/build-info.json
          # Approved release (2026-11-02 Pacific): publish the reviewed responsive
          # eBay shopping layouts and single-count affiliate click reporting.
          # Pin production to an immutable tested commit; future preview changes
          # must NOT silently update production.
          RELEASE_SHA="df4f889e06a1dd7a5e996661260a771d286ff504"
          test "$(git rev-parse "$RELEASE_SHA^{commit}")" = "$RELEASE_SHA"
          git worktree add "$RUNNER_TEMP/archiv-lego-production" "$RELEASE_SHA"
          npm --prefix "$RUNNER_TEMP/archiv-lego-production" ci
          # The production copy gets the same validated generated LEGO data as preview.
          cp "$RUNNER_TEMP/archiv-lego-preview/src/lego-catalog.json" "$RUNNER_TEMP/archiv-lego-production/src/lego-catalog.json"
          cp "$RUNNER_TEMP/archiv-lego-preview/src/lego-themes.json" "$RUNNER_TEMP/archiv-lego-production/src/lego-themes.json"
          mkdir -p "$RUNNER_TEMP/archiv-lego-production/public/lego-parts"
          cp -R "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts/." "$RUNNER_TEMP/archiv-lego-production/public/lego-parts/"
          node -e 'const fs=require("fs");const root=process.argv[1];const sets=JSON.parse(fs.readFileSync(root+"/src/lego-catalog.json"));const themes=JSON.parse(fs.readFileSync(root+"/src/lego-themes.json"));const shards=fs.readdirSync(root+"/public/lego-parts").filter(x=>/^[0-9]+[.]json$/.test(x));if(sets.length<25000||themes.length<15||shards.length!==128)throw Error("Incomplete production catalog: "+sets.length+" sets, "+themes.length+" themes, "+shards.length+" inventory shards");console.log("Production catalog validated:",sets.length,"sets,",themes.length,"themes,",shards.length,"inventory shards")' "$RUNNER_TEMP/archiv-lego-production"
          # Protect collector dashboard, catalog controls, scanner, and photo permissions.
          test -s "$RUNNER_TEMP/archiv-lego-production/src/lego-photo-ui.ts"
          test -s "$RUNNER_TEMP/archiv-lego-production/src/lego-photo-contributions.ts"
          test -s "$RUNNER_TEMP/archiv-lego-production/public/archiv-red-brick-accent-logo.webp"
          # Never promote the orange sketch logo to production without an explicit approval.
          test "$(git -C "$RUNNER_TEMP/archiv-lego-production" hash-object public/archiv-red-brick-accent-logo.webp)" = "6f1cacc29189c094077057f029794d96c3661d06"
          grep -Fq 'const collectorRoute=collectorViewFromHash()' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'const navigation=e("nav","archiv-set-back-navigation")' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'launchSetScanner' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'renderPhotoModeration' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'Submit for community review (optional).' "$RUNNER_TEMP/archiv-lego-production/src/lego-photo-ui.ts"
          grep -Fq 'new URL("terms.html#community-photos",window.location.href)' "$RUNNER_TEMP/archiv-lego-production/src/lego-photo-ui.ts"
          grep -Fq 'new URL("privacy.html#uploaded-photos",window.location.href)' "$RUNNER_TEMP/archiv-lego-production/src/lego-photo-ui.ts"
          grep -Fq 'archiv-red-brick-accent-logo.webp' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'archiv-red-brick-accent-logo.webp' "$RUNNER_TEMP/archiv-lego-production/public/terms.html"
          grep -Fq 'archiv-red-brick-accent-logo.webp' "$RUNNER_TEMP/archiv-lego-production/public/privacy.html"
          # Ensure the production release includes the reviewed method-selection and recovery flows.
          test -s "$RUNNER_TEMP/archiv-lego-production/tests/email-password-auth.test.ts"
          grep -Fq 'menu.append(button("Sign in",()=>{account.open=false;goAuthPage("sign-in")}' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'menu.append(button("Sign up",()=>{account.open=false;goAuthPage("sign-up")}' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'signInWithEmailAndPassword(legoAuth,address,password)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'createUserWithEmailAndPassword(legoAuth,address,password)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'sendPasswordResetEmail(legoAuth,address)' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,deletionPassword))' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'if(!currentUser){goAuthPage("sign-in");return}' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'PHOTO_LICENSE_VERSION="archiv-community-photo-license-v1-2026-11-01"' "$RUNNER_TEMP/archiv-lego-production/src/lego-photo-contributions.ts"
          grep -Fq 'match /communitySetPhotos/{photoId}' "$RUNNER_TEMP/archiv-lego-production/firestore.rules"
          grep -Fq 'catalogLink.href="#/complete-catalog"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'bottom.href="#/complete-catalog"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          # The three reviewed eBay presentations share search links and nearby disclosures.
          test -s "$RUNNER_TEMP/archiv-lego-production/tests/ebay-marketplace-ui.test.ts"
          for placement in detail catalog wishlist; do
            grep -Fq "ebayShopping(row,\"$placement\")" "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
            grep -Fq ".archiv-marketplace-$placement" "$RUNNER_TEMP/archiv-lego-production/src/lego-styles.css"
          done
          grep -Fq 'Affiliate link: Archív may earn a commission from qualifying purchases.' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          grep -Fq 'link.href=ebaySetSearch(row);link.target="_blank";link.rel="noopener noreferrer sponsored"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          ! grep -Fq 'buy.onclick=()=>{void reportAffiliateClick()}' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          # Confirm every published support, privacy, and photo-removal contact uses the correct domain.
          test -s "$RUNNER_TEMP/archiv-lego-production/public/contact.html"
          for file in src/lego-entry.ts src/lego-photo-contributions.ts public/contact.html public/terms.html public/privacy.html; do
            grep -Fq 'support@archivcollect.com' "$RUNNER_TEMP/archiv-lego-production/$file"
            ! grep -Fq 'support@archivecollect.com' "$RUNNER_TEMP/archiv-lego-production/$file"
          done
          # Tests run against the exact source that will be published.
          npm --prefix "$RUNNER_TEMP/archiv-lego-production" run check
          VITE_PROFILE_BACKEND_READY=true VITE_PHOTO_BACKEND_READY=true npm --prefix "$RUNNER_TEMP/archiv-lego-production" run build:web
          # Publish the complete pinned release and restore the independently built preview.
          cp -R "$RUNNER_TEMP/archiv-lego-production/dist-web/." dist-web/
          cp -R "$RUNNER_TEMP/archiv-lego-preview/dist-web/." dist-web/lego-preview/
          # The app and legal release are pinned; publish the separately reviewed
          # static Attribution page from this workflow commit (missing in release snapshot).
          # Replace the older preview attribution to keep both links consistent.
          test -s public/attribution.html
          cp public/attribution.html dist-web/attribution.html
          cp public/attribution.html dist-web/lego-preview/attribution.html
          # Attribution is copied from main, so fix its staging logo reference too.
          sed -i 's/archiv-red-brick-accent-logo.webp/archiv-orange-sketch-20261106.webp/g;s/width="1400" height="466"/width="720" height="360"/g' dist-web/lego-preview/attribution.html
          # The preview must load the unique orange sketch across ALL pages.
          printf '%s  %s\n' "7ef92907b5f43d5f6ff4f351f3b6a732e48d9e24581a1d3b4c4c714a82cfc368" "dist-web/lego-preview/archiv-orange-sketch-20261106.webp" | sha256sum --check
          for file in terms.html privacy.html contact.html attribution.html; do
            grep -Fq 'src="./archiv-orange-sketch-20261106.webp"' "dist-web/lego-preview/$file"
          done
          grep -Rql 'archiv-orange-sketch-20261106.webp' dist-web/lego-preview/assets
          ! cmp -s dist-web/archiv-red-brick-accent-logo.webp dist-web/lego-preview/archiv-orange-sketch-20261106.webp
          cp dist-web/catalog-refresh.json dist-web/lego-preview/catalog-refresh.json
          printf '{"source_commit":"%s","branch":"feature/owned-set-photo-review-20261031","photo_backend_ready":true}\n' "$PREVIEW_SHA" > dist-web/lego-preview/build-info.json
          # The production release must carry its matching approved photo terms
          # and privacy notices, not the old legal snapshot.
          test -s dist-web/privacy.html
          test -s dist-web/terms.html
          test -s dist-web/contact.html
          test -s dist-web/attribution.html
          grep -Fq 'href="./archiv-red-brick-accent-logo.webp"' dist-web/attribution.html || grep -Fq 'src="./archiv-red-brick-accent-logo.webp"' dist-web/attribution.html
          grep -Fq 'https://rebrickable.com/' dist-web/attribution.html
          grep -Fq 'eBay Partner Network' dist-web/attribution.html
          grep -Fq 'href="./attribution.html"' dist-web/terms.html
          grep -Fq '"Attribution","attribution.html"' "$RUNNER_TEMP/archiv-lego-production/src/lego-entry.ts"
          for file in contact.html privacy.html terms.html; do
            grep -Fq 'support@archivcollect.com' "dist-web/$file"
            ! grep -Fq 'support@archivecollect.com' "dist-web/$file"
          done
          grep -Fq 'id="community-photos"' dist-web/terms.html
          grep -Fq 'id="uploaded-photos"' dist-web/privacy.html
          grep -Fq 'non-exclusive, worldwide, royalty-free license' dist-web/terms.html
          grep -Fq 'approved LEGO.com affiliate' dist-web/terms.html
          grep -Fq 'request removal' dist-web/privacy.html
          grep -Fq 'using Google or an email address and password' dist-web/privacy.html
          grep -Fq 'using Google or an email address and password' dist-web/terms.html
          grep -Fq 'src="./archiv-red-brick-accent-logo.webp"' dist-web/privacy.html
          grep -Fq 'src="./archiv-red-brick-accent-logo.webp"' dist-web/terms.html
          test -s dist-web/archiv-red-brick-accent-logo.webp
          # No legacy Impact tracking snippet may be reintroduced at production root.
          ! grep -Fq 'utt.impactcdn.com' dist-web/index.html
          ! grep -Fq 'impactStat' dist-web/index.html
          printf '{"source_commit":"%s","branch":"feature/owned-set-photo-review-20261031","profile_backend_ready":true,"photo_backend_ready":true,"legal_source_commit":"%s"}\n' "$RELEASE_SHA" "$RELEASE_SHA" > dist-web/build-info.json
          echo "Production approved release: $RELEASE_SHA"
      # GA4 is an audited post-build overlay. The approved app commit stays pinned;
      # no analytics code is added to LEGO preview or the collector application.
      - name: Install Archív GA4 and publish privacy disclosure
        run: |
          node scripts/install-archiv-ga4.mjs dist-web
          grep -Fq 'G-HY619R4T32' dist-web/index.html
          grep -Fq 'Google Analytics 4:' dist-web/privacy.html
          node -e 'const m=require("./dist-web/build-info.json"); if(m.ga4_measurement_id!=="G-HY619R4T32") process.exit(1)'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Fresh deployment id for GitHub Pages stalled sync (2026-11-06).
        # Production app/logo remain pinned; only staging's six illustrated bricks differ.
        uses: actions/deploy-pages@v4

      - name: Verify live production build and photo policies
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jhoward02.github.io/archiv-app"
          EXPECTED="df4f889e06a1dd7a5e996661260a771d286ff504"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 --retry 1 -H 'Cache-Control: no-cache' "$BASE/build-info.json?release-check=$GITHUB_RUN_ID-$attempt" -o /tmp/archiv-production-info.json \
              && python3 -c 'import json,sys; d=json.load(open("/tmp/archiv-production-info.json")); assert d.get("source_commit")==sys.argv[1] and d.get("legal_source_commit")==sys.argv[1] and d.get("photo_backend_ready") is True and d.get("profile_backend_ready") is True, d' "$EXPECTED"; then
              echo "Live production commit and photo backend confirmed: $EXPECTED"
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Published production build-info.json did not match approved release $EXPECTED"
              exit 1
            fi
            sleep 8
          done
          # A scheduled refresh may keep the same application commit. Verify this run's
          # catalog manifest independently, so a stale site cannot pass as refreshed.
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$BASE/catalog-refresh.json?verify=$GITHUB_RUN_ID-$attempt" -o /tmp/archiv-production-catalog-refresh.json \
              && python3 -c 'import json,os; d=json.load(open("/tmp/archiv-production-catalog-refresh.json")); assert d["github_run_id"]==os.environ["GITHUB_RUN_ID"] and d["set_count"]>=28000 and d["inventory_shard_count"]==128, d' ; then
              echo "Live Rebrickable catalog refresh confirmed for run $GITHUB_RUN_ID"
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Published catalog-refresh.json did not match this deployment"
              exit 1
            fi
            sleep 8
          done
          curl --fail --silent --show-error --location --max-time 20 "$BASE/terms.html?verify=$GITHUB_RUN_ID" -o /tmp/archiv-production-terms.html
          curl --fail --silent --show-error --location --max-time 20 "$BASE/privacy.html?verify=$GITHUB_RUN_ID" -o /tmp/archiv-production-privacy.html
          curl --fail --silent --show-error --location --max-time 20 "$BASE/contact.html?verify=$GITHUB_RUN_ID" -o /tmp/archiv-production-contact.html
          # Do not accept a GitHub Pages 404 or SPA fallback as a successful page.
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$BASE/attribution.html?verify=$GITHUB_RUN_ID-$attempt" -o /tmp/archiv-production-attribution.html \
              && grep -Fq '<title>Attribution | Archív</title>' /tmp/archiv-production-attribution.html \
              && grep -Fq 'Rebrickable catalog and inventories' /tmp/archiv-production-attribution.html \
              && grep -Fq 'src="./archiv-red-brick-accent-logo.webp"' /tmp/archiv-production-attribution.html; then
              echo "Live Attribution page and linked sources verified"
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::The live Attribution page did not publish correctly"
              exit 1
            fi
            sleep 8
          done
          for file in /tmp/archiv-production-contact.html /tmp/archiv-production-privacy.html /tmp/archiv-production-terms.html; do
            grep -Fq 'support@archivcollect.com' "$file"
            ! grep -Fq 'support@archivecollect.com' "$file"
          done
          curl --fail --silent --show-error --location --max-time 20 "$BASE/?verify=$GITHUB_RUN_ID" -o /tmp/archiv-production-index.html
          grep -Fq 'id="community-photos"' /tmp/archiv-production-terms.html
          grep -Fq 'id="uploaded-photos"' /tmp/archiv-production-privacy.html
          grep -Fq 'using Google or an email address and password' /tmp/archiv-production-terms.html
          grep -Fq 'using Google or an email address and password' /tmp/archiv-production-privacy.html
          grep -Fq 'archiv-red-brick-accent-logo.webp' /tmp/archiv-production-terms.html
          grep -Fq 'archiv-red-brick-accent-logo.webp' /tmp/archiv-production-privacy.html
          curl --fail --silent --show-error --location --max-time 20 "$BASE/archiv-red-brick-accent-logo.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-logo.webp
          python3 -c 'from pathlib import Path; b=Path("/tmp/archiv-live-logo.webp").read_bytes(); assert len(b)>10000 and b[:4]==b"RIFF" and b[8:12]==b"WEBP", "Missing red-brick artwork"'
          # Confirm the actual STAGING application JS references the new cache-busted asset,
          # not merely that an unused file exists in the published output.
          curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$BASE/lego-preview/?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-preview-index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("/tmp/archiv-live-preview-index.html").read_text()
          matches=re.findall(r'<script[^>]+src="([^"]+)"',html)
          scripts=[x for x in matches if x.startswith("./assets/") and x.endswith(".js")]
          assert scripts, "Staging index does not reference its own Vite JS bundle"
          Path("/tmp/archiv-preview-script-path").write_text(scripts[0][2:])
          PY
          SCRIPT_PATH="$(cat /tmp/archiv-preview-script-path)"
          # Verify the live stylesheet, not just the separate asset or source branch.
          python3 - <<'PY'
          import re
          from pathlib import Path
          page=Path("/tmp/archiv-live-preview-index.html").read_text()
          css=re.findall(r'href="(\./assets/[^"]+\.css)"',page)
          assert css, "No preview stylesheet link found in live HTML"
          Path("/tmp/archiv-preview-style-path").write_text(css[0][2:])
          PY
          STYLE_PATH="$(cat /tmp/archiv-preview-style-path)"
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/$STYLE_PATH?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-preview-styles.css
          grep -Fq '.archiv-theme-brick-art' /tmp/archiv-live-preview-styles.css
          grep -Fq '.archiv-theme-set-photo' /tmp/archiv-live-preview-styles.css
          grep -Fq 'margin-top:-24px' /tmp/archiv-live-preview-styles.css
          grep -Fq 'margin-top:-9px' /tmp/archiv-live-preview-styles.css
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/$SCRIPT_PATH?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-preview-script.js
          grep -Fq 'archiv-orange-sketch-20261106.webp' /tmp/archiv-live-preview-script.js
          grep -Fq 'theme-city.webp' /tmp/archiv-live-preview-script.js
          grep -Fq 'theme-icons.webp' /tmp/archiv-live-preview-script.js
          ! grep -Fq 'BASE_URL+"archiv-red-brick-accent-logo.webp"' /tmp/archiv-live-preview-script.js
          # Verify the exact approved illustrated assets on public GitHub Pages.
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/theme-bricks/theme-city.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-brick-city.webp
          printf '%s  %s\n' "cc373db24bfb2e8938dbc0f8f561265e6a07b6deef3e7850a98bad6c1f870ec4" "/tmp/archiv-live-brick-city.webp" | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/theme-bricks/theme-pokemon.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-brick-pokemon.webp
          printf '%s  %s\n' "8f92d2d5ccd95bf013b5ba4b65ff250fff35f511f31efe6c5eef99414fcd9676" "/tmp/archiv-live-brick-pokemon.webp" | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/theme-bricks/theme-star-wars.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-brick-star-wars.webp
          printf '%s  %s\n' "3ff29ca62a9c05af99daaa7fa360b3b6f18c9189c04769ca6b336f79b4e0c7bc" "/tmp/archiv-live-brick-star-wars.webp" | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/theme-bricks/theme-technic.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-brick-technic.webp
          printf '%s  %s\n' "7b878c01c73ae3f01e7e812708c8ae9c1dcc915e4d86902c812a9e636c55e387" "/tmp/archiv-live-brick-technic.webp" | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/theme-bricks/theme-botanicals.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-brick-botanicals.webp
          printf '%s  %s\n' "055fd6654dae156365f3565de36f9700b639eeea4d1d4465ea12023373c9c72f" "/tmp/archiv-live-brick-botanicals.webp" | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/theme-bricks/theme-icons.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-brick-icons.webp
          printf '%s  %s\n' "15f5e889e03bdee65a2e6b66f8ac031bf52421bd56506667d39492d8e4cc9131" "/tmp/archiv-live-brick-icons.webp" | sha256sum --check
          echo 'All six user-supplied illustrated bricks are live and unchanged.'
          # The asset itself must match the corrected user-supplied art byte for byte.
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/archiv-orange-sketch-20261106.webp?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-preview-logo.webp
          printf '%s  %s\n' "7ef92907b5f43d5f6ff4f351f3b6a732e48d9e24581a1d3b4c4c714a82cfc368" "/tmp/archiv-live-preview-logo.webp" | sha256sum --check
          curl --fail --silent --show-error --location --max-time 20 "$BASE/lego-preview/terms.html?verify=$GITHUB_RUN_ID" -o /tmp/archiv-live-preview-terms.html
          grep -Fq 'src="./archiv-orange-sketch-20261106.webp"' /tmp/archiv-live-preview-terms.html
          echo 'Live staging JS, legal-page reference and orange-sketch asset verified; production unchanged.'
          # Verify published root measurements and legal disclosure (not just build output).
          grep -Fq 'G-HY619R4T32' /tmp/archiv-production-index.html
          grep -Fq 'Google Analytics 4:' /tmp/archiv-production-privacy.html
          grep -Fq 'Archív | LEGO Collections' /tmp/archiv-production-index.html
          ! grep -Fq 'utt.impactcdn.com' /tmp/archiv-production-index.html
          ! grep -Fq 'impactStat' /tmp/archiv-production-index.html
          echo 'Live production homepage, photo terms and privacy policy verified.'
