name: Deploy Collector Scan to GitHub Pages

on:
  push:
    branches: [main, archiv-2-lego-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - name: Build isolated profiles preview
        run: |
          git fetch origin feature/restore-profile
          git worktree add "$RUNNER_TEMP/archiv-profile-preview" 08a8a2d74e7237f55d954b9fd79c0dca6e9cdea3
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" ci
          npm --prefix "$RUNNER_TEMP/archiv-profile-preview" run build:web
          mkdir -p dist-web/profile-preview
          cp -R "$RUNNER_TEMP/archiv-profile-preview/dist-web/." dist-web/profile-preview/
      # Approved staging-only refresh: collector profile preview (staging commit 448bcc072dcb8a3a35ad73ca3cbd554d4a1ee59e).
      # Production application assets remain sourced from pinned cfd3562675c3503d466553918cd6a304256632fa.
      - name: Build isolated LEGO preview
        run: |
          git fetch origin archiv-2-lego-staging
          git worktree add "$RUNNER_TEMP/archiv-lego-preview" origin/archiv-2-lego-staging
          PREVIEW_SHA=$(git -C "$RUNNER_TEMP/archiv-lego-preview" rev-parse HEAD)
          echo "Preview source: $PREVIEW_SHA"
          npm --prefix "$RUNNER_TEMP/archiv-lego-preview" ci
          mkdir -p "$RUNNER_TEMP/archiv-lego-preview/data"
          curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/sets.csv.gz" -o "$RUNNER_TEMP/archiv-lego-preview/data/sets.csv.gz"
          curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/themes.csv.gz" -o "$RUNNER_TEMP/archiv-lego-preview/data/themes.csv.gz"
          for name in colors parts minifigs inventories inventory_parts inventory_minifigs; do
            curl --fail --location --retry 3 --silent --show-error "https://cdn.rebrickable.com/media/downloads/${name}.csv.gz" -o "$RUNNER_TEMP/archiv-lego-preview/data/${name}.csv.gz"
          done
          node "$RUNNER_TEMP/archiv-lego-preview/scripts/import-rebrickable.mjs"
          node --max-old-space-size=6144 "$RUNNER_TEMP/archiv-lego-preview/scripts/import-lego-parts.mjs"
          npm --prefix "$RUNNER_TEMP/archiv-lego-preview" run build:web
          mkdir -p dist-web/lego-preview
          cp -R "$RUNNER_TEMP/archiv-lego-preview/dist-web/." dist-web/lego-preview/
          printf '{"source_commit":"%s","branch":"archiv-2-lego-staging"}\n' "$PREVIEW_SHA" > dist-web/lego-preview/build-info.json
          # Promote the verified LEGO build to the production root, without
          # removing independent preview directories or the rollback branch.
          # Keep the production release pinned while new shopping features are tested.
          # The preview above always builds from the latest LEGO staging branch.
          # Rebuild preview with optional Firebase Google sign-in and cloud LEGO records.
          # Retry staging preview via newest push; Pages concurrency cancels superseded runs.
          # Refresh staging preview for Google sign-in and sign-up button presentation.
          # Refresh LEGO staging preview with expandable account menu.
          # Refresh staging with Google profile image account toggle.
          # Stage private collector analytics dashboard and reporting UI.
          # Stage per-user activity and daily reporting; production pin unchanged.
          # Preview readable activity and registration totals.
          # Preview Firebase free-plan account reporting without callable functions.
          # Refresh theme header account and back-button alignment in staging.
          # Refresh product detail header controls alignment in staging.
          # Reserve a dedicated navigation lane above the theme tile.
          # Preview mobile homepage avatar anchored to upper-right of logo.
          # Preview theme set-list page without redundant featured theme brick.
          # Production stays on its pre-policy-change source snapshot until approved.
          # Do not copy unapproved staging files into the production root.
          git worktree add "$RUNNER_TEMP/archiv-lego-production" 7ad5c81340e72b69821b14a9f616ed65ea48cb3e^
          npm --prefix "$RUNNER_TEMP/archiv-lego-production" ci
          # Restore the full generated catalog used by successful production builds.
          # The staging importer writes src/*.json and public/lego-parts, NOT public/data.
          # Copy only generated catalog/inventory data, never staged application code or styles.
          cp "$RUNNER_TEMP/archiv-lego-preview/src/lego-catalog.json" "$RUNNER_TEMP/archiv-lego-production/src/lego-catalog.json"
          cp "$RUNNER_TEMP/archiv-lego-preview/src/lego-themes.json" "$RUNNER_TEMP/archiv-lego-production/src/lego-themes.json"
          mkdir -p "$RUNNER_TEMP/archiv-lego-production/public/lego-parts"
          cp -R "$RUNNER_TEMP/archiv-lego-preview/public/lego-parts/." "$RUNNER_TEMP/archiv-lego-production/public/lego-parts/"
          # Fail the deployment rather than silently publishing the tiny seed catalog again.
          node -e 'const fs=require("fs");const root=process.argv[1];const sets=JSON.parse(fs.readFileSync(root+"/src/lego-catalog.json"));const themes=JSON.parse(fs.readFileSync(root+"/src/lego-themes.json"));const shards=fs.readdirSync(root+"/public/lego-parts").filter(x=>/^[0-9]+[.]json$/.test(x));if(sets.length<25000||themes.length<15||shards.length!==128)throw Error("Incomplete production catalog: "+sets.length+" sets, "+themes.length+" themes, "+shards.length+" inventory shards");console.log("Production catalog validated:",sets.length,"sets,",themes.length,"themes,",shards.length,"inventory shards")' "$RUNNER_TEMP/archiv-lego-production"
          # Fetch the deliberately pinned production-only disclosure hotfix.
          # This keeps staging-only UI and features out of the production root.
          git fetch origin hotfix/ebay-disclosure-production-20261031
          git -C "$RUNNER_TEMP/archiv-lego-production" restore --source=cfd3562675c3503d466553918cd6a304256632fa -- src/lego-entry.ts src/lego-styles.css
          npm --prefix "$RUNNER_TEMP/archiv-lego-production" run build:web
          cp -R "$RUNNER_TEMP/archiv-lego-production/dist-web/." dist-web/
          # Reassert exact preview output after production copy, including legal pages.
          cp -R "$RUNNER_TEMP/archiv-lego-preview/dist-web/." dist-web/lego-preview/
          printf '{"source_commit":"%s","branch":"archiv-2-lego-staging"}\n' "$PREVIEW_SHA" > dist-web/lego-preview/build-info.json
          # Narrow legal/privacy hotfix for the already-published catalog.
          # DO NOT promote the staged app's features, UI, or auth changes.
          cp "$RUNNER_TEMP/archiv-lego-preview/dist-web/privacy.html" dist-web/privacy.html
          cp "$RUNNER_TEMP/archiv-lego-preview/dist-web/terms.html" dist-web/terms.html
          test -s dist-web/privacy.html
          test -s dist-web/terms.html
          grep -q 'To request access, correction, export, or deletion' dist-web/privacy.html
          grep -q 'not currently an approved LEGO.com affiliate' dist-web/terms.html
          # Retire the unused Impact impression/conversion script on the pinned
          # root site. It loads before user interaction and the new policy must
          # describe actual tracking practices accurately.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist-web/index.html')
          html=root.read_text()
          scripts=re.findall(r'<script\b[^>]*>[\s\S]*?</script>',html,flags=re.I)
          impact=[x for x in scripts if 'utt.impactcdn.com' in x or 'impactStat' in x]
          assert len(impact)==1, f'Expected one legacy Impact script; found {len(impact)}'
          html=html.replace(impact[0],'')
          assert 'utt.impactcdn.com' not in html
          root.write_text(html)
          print('Production root: updated only legal pages and removed legacy Impact tracking script')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
