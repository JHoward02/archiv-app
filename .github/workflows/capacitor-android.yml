name: Build self-contained Archív Android app

on:
  push:
    branches: [main]
    paths: ['.github/workflows/capacitor-android.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out native Archív staging code
        uses: actions/checkout@v4
        with:
          ref: archiv-2-lego-staging

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reuse the approved Archív catalog release (no new Rebrickable downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p native-pages pages-archive
          gh run download 41140359983 -R JHoward02/archiv-app -n github-pages -D pages-archive
          tar -xf pages-archive/artifact.tar -C native-pages
          node scripts/prepare-native-web.mjs

      - name: Install existing web dependencies
        run: npm ci

      - name: Install Capacitor Android and native plugins for this isolated build
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund \
            @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/android@7.6.10 \
            @capacitor/browser@7.0.5 @capacitor-firebase/authentication@7.5.0

      - name: Register native plugins in the isolated build manifest
        run: |
          npm pkg set "dependencies.@capacitor/core=7.6.10" "dependencies.@capacitor/android=7.6.10" "dependencies.@capacitor/browser=7.0.5" "dependencies.@capacitor-firebase/authentication=7.5.0" "devDependencies.@capacitor/cli=7.6.10"
          # GitHub Actions checkout is never committed back; web dependencies stay unchanged.

      - name: Check TypeScript and package the Archív web interface
        run: |
          # Existing theme catalog code has unrelated strict TS warnings; Vite transpiles it.
          npm run build:web
          test -f dist-web/index.html
          test -f dist-web/lego-parts/0.json

      - name: Create native Android project and copy local web assets
        run: |
          npx cap add android
          npx cap sync android
          # Android 15+ draws behind status/navigation bars by default.
          # Apply real device window insets to the native content view.
          cp android-native/MainActivity.java android/app/src/main/java/app/archiv/collector/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.systemBars()' android/app/src/main/java/app/archiv/collector/MainActivity.java
          node -e 'const fs=require("fs");const plugins=JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.plugins.json","utf8")); console.log("Native plugins:",plugins); if(!JSON.stringify(plugins).includes("FirebaseAuthentication") || !JSON.stringify(plugins).includes("Browser")) process.exit(1);'
          # Include the Android Google provider and credentials manager when configured.
          printf '\n' >> android/variables.gradle
          cat >> android/variables.gradle <<'EOF'
          ext.rgcfaIncludeGoogle = true
          ext.androidxCredentialsVersion = '1.3.0'
          EOF
          if [ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
            echo "Firebase Android configuration provided."
          else
            echo "::warning::Firebase Android app has not been registered. Native Google sign-in requires google-services.json and a registered Android SHA-1."
          fi

      - name: Prepare approved navy-and-gold brick launcher icon
        run: |
          python3 -m pip install --user pillow
          cd android-test
          python3 generate_icons.py
          python3 -c 'from PIL import Image; p=Image.open("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"); assert p.size == (192,192); print("Validated native launcher image: ",p.size)'
          cd ..
          # Remove Capacitor template adaptive icons so Android uses the user's A-frame art.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -R android-test/app/src/main/res/mipmap-* android/app/src/main/res/

      - name: Build locally packaged Android test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Show signing fingerprint for Firebase Android setup
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' || true

      - name: Publish installable native APK
        uses: actions/upload-artifact@v4
        with:
          name: archiv-native-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
