name: Build self-contained Archív Android app

on:
  push:
    branches: [main]
    paths: ['.github/workflows/capacitor-android.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out native Archív staging code
        uses: actions/checkout@v4
        with:
          ref: archiv-2-lego-staging

      - name: Confirm private Android release credentials are configured
        env:
          ARCHIV_KEYSTORE_B64: ${{ secrets.ARCHIV_ANDROID_KEYSTORE_B64 }}
          ARCHIV_KEYSTORE_PASSWORD: ${{ secrets.ARCHIV_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ARCHIV_KEYSTORE_B64" ] || [ -z "$ARCHIV_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set ARCHIV_ANDROID_KEYSTORE_B64 and ARCHIV_ANDROID_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions before building an updatable Android APK."
            exit 1
          fi
          echo "Release signing credentials are present."

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reuse the approved Archív catalog release (no new Rebrickable downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p native-pages pages-archive
          gh run download 41140359983 -R JHoward02/archiv-app -n github-pages -D pages-archive
          tar -xf pages-archive/artifact.tar -C native-pages
          node scripts/prepare-native-web.mjs

      - name: Install existing web dependencies
        run: npm ci

      - name: Install Capacitor Android and native plugins for this isolated build
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund \
            @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/android@7.6.10 \
            @capacitor/browser@7.0.5 @capacitor-firebase/authentication@7.5.0

      - name: Register native plugins in the isolated build manifest
        run: |
          npm pkg set "dependencies.@capacitor/core=7.6.10" "dependencies.@capacitor/android=7.6.10" "dependencies.@capacitor/browser=7.0.5" "dependencies.@capacitor-firebase/authentication=7.5.0" "devDependencies.@capacitor/cli=7.6.10"
          # GitHub Actions checkout is never committed back; web dependencies stay unchanged.

      - name: Check TypeScript and package the Archív web interface
        run: |
          # Existing theme catalog code has unrelated strict TS warnings; Vite transpiles it.
          npm run build:web
          test -f dist-web/index.html
          test -f dist-web/lego-parts/0.json

      - name: Create native Android project and copy local web assets
        run: |
          npx cap add android
          npx cap sync android
          # Android 15+ draws behind status/navigation bars by default.
          # Apply real device window insets to the native content view.
          cp android-native/MainActivity.java android/app/src/main/java/app/archiv/collector/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.systemBars()' android/app/src/main/java/app/archiv/collector/MainActivity.java
          node -e 'const fs=require("fs");const plugins=JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.plugins.json","utf8")); console.log("Native plugins:",plugins); if(!JSON.stringify(plugins).includes("FirebaseAuthentication") || !JSON.stringify(plugins).includes("Browser")) process.exit(1);'
          # Include the Android Google provider and credentials manager when configured.
          printf '\n' >> android/variables.gradle
          cat >> android/variables.gradle <<'EOF'
          ext.rgcfaIncludeGoogle = true
          ext.androidxCredentialsVersion = '1.3.0'
          EOF
          # Firebase client configuration is non-secret and supplied by the owner.
          cp android-native/google-services.json android/app/google-services.json
          node -e 'const c=require("./android/app/google-services.json"); const a=c.client.find(x=>x.client_info.android_client_info.package_name==="app.archiv.collector"); const expected="02fd087799122a19d5fd8ca287aa2de9f09e0b9e"; if(c.project_info.project_id!=="archiv-3f5df" || !a?.oauth_client?.some(o=>o.client_type===1 && o.android_info?.certificate_hash===expected)){console.error("Firebase Android OAuth registration must match Archív testing certificate");process.exit(1)} console.log("Verified Firebase Android OAuth SHA-1 registration")'
          # Capacitor generates Groovy Gradle files; Google Services must be applied
          # explicitly to generate native Firebase OAuth client resources.
          sed -i "/classpath 'com.android.tools.build:gradle:/a\\        classpath 'com.google.gms:google-services:4.5.0'" android/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          apply plugin: 'com.google.gms.google-services'
          EOF

      - name: Require approved Android release signing credentials
        env:
          ARCHIV_KEYSTORE_B64: ${{ secrets.ARCHIV_ANDROID_KEYSTORE_B64 }}
          ARCHIV_KEYSTORE_PASSWORD: ${{ secrets.ARCHIV_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ARCHIV_KEYSTORE_B64" ] || [ -z "$ARCHIV_KEYSTORE_PASSWORD" ]; then
            echo "::error::Archív Android release requires both ARCHIV_ANDROID_KEYSTORE_B64 and ARCHIV_ANDROID_KEYSTORE_PASSWORD in repository Actions secrets. Do not substitute an ephemeral debug key."
            exit 1
          fi
          printf '%s' "$ARCHIV_KEYSTORE_B64" | base64 -d > android/app/archiv-test-signing.p12
          chmod 600 android/app/archiv-test-signing.p12
          ACTUAL_SHA1="$(keytool -list -v -keystore android/app/archiv-test-signing.p12 -storepass "$ARCHIV_KEYSTORE_PASSWORD" -alias archiv-test | sed -n 's/.*SHA1: //p' | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_SHA1" != "02fd087799122a19d5fd8ca287aa2de9f09e0b9e" ]; then
            echo "::error::Signing certificate does not match Archív's registered Firebase SHA-1."
            exit 1
          fi
          echo "Verified persistent certificate matches Firebase Android OAuth registration."
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  archivTesting {
                      storeFile file("archiv-test-signing.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("ARCHIV_KEYSTORE_PASSWORD")
                      keyAlias "archiv-test"
                      keyPassword System.getenv("ARCHIV_KEYSTORE_PASSWORD")
                  }
              }
              defaultConfig {
                  versionCode 100 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "0.2." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.archivTesting
                  }
              }
          }
          EOF
          echo "Archív Android APK will be signed with the permanent Firebase-authorized certificate."

      - name: Prepare approved navy-and-gold brick launcher icon
        run: |
          python3 -m pip install --user pillow
          cd android-test
          python3 generate_icons.py
          python3 -c 'from PIL import Image; p=Image.open("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"); assert p.size == (192,192); print("Validated native launcher image: ",p.size)'
          cd ..
          # Remove Capacitor template adaptive icons so Android uses the user's A-frame art.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -R android-test/app/src/main/res/mipmap-* android/app/src/main/res/

      - name: Build locally packaged Android test APK
        working-directory: android
        env:
          ARCHIV_KEYSTORE_PASSWORD: ${{ secrets.ARCHIV_ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify final APK uses the registered Firebase certificate
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose "$APK" > /dev/null
          SIGNER_SHA1="$("$APK_SIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          if [ "$SIGNER_SHA1" != "02fd087799122a19d5fd8ca287aa2de9f09e0b9e" ]; then
            echo "::error::APK signing certificate SHA-1 does not match Firebase."
            exit 1
          fi
          echo "Verified APK certificate matches registered Firebase SHA-1."

      - name: Export Android SDK signing utility for offline certificate testing
        run: |
          TOOL=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$TOOL"
          mkdir -p signing-tools
          cp "$TOOL" signing-tools/apksigner.jar
          java -jar signing-tools/apksigner.jar --version

      - name: Publish Android SDK signing utility
        uses: actions/upload-artifact@v4
        with:
          name: archiv-apk-signing-utility
          path: signing-tools/apksigner.jar
          retention-days: 2

      - name: Publish installable native APK
        uses: actions/upload-artifact@v4
        with:
          name: archiv-native-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
